name: Refresh menus and publish GitHub Pages

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "11 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch current canteen menus
        if: github.event_name != 'schedule' || github.event.schedule == '11 */6 * * *'
        env:
          TZ: Europe/Berlin
        run: python scripts/update_mensa_data.py

      - name: Fetch nearby fuel stations and prices
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
        run: python scripts/update_fuel_stations.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          mkdir dist
          cp index.html study-plan.json mensa-data.json fuel-stations.json studienablaufplan.ics Studienablaufplanung_ELT2526_050926.pdf dist/
          cp -r assets css js dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
